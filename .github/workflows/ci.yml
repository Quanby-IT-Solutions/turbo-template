name: CI
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
  workflow_call:
    inputs:
      run-e2e:
        type: boolean
        default: true
    secrets:
      NPM_TOKEN:
        required: false
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI-6 / F-26: least privilege, stated rather than inherited.
#
# Without a block here the job runs on whatever the repository/organization
# default grants, which is commonly write-all — the caller's token is the
# ceiling for the reusable workflow, so an unstated default is the broadest
# possible grant to external code.
#
# This is deliberately not a bare `contents: read`. A called workflow can only
# restrict the caller's token, never escalate it, and the quality gate posts
# coverage comments and check results, which need `pull-requests: write` and
# `checks: write`; a read-only baseline here would break them on every PR.
# These three are the callee's actual requirements (confirmed in the CI-3
# review of the pinned SHA below) and nothing more — no `packages`, no
# `id-token`, no `actions: write`.
permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # The pinned quality gate filters Playwright on its own `web` paths only.
  # That filter does not include the backend, packages/observability, or
  # tooling, and the gate pin stays put. This job drives the gate's existing
  # `run-e2e` input from this repository when those paths change, and when
  # the lockfile, workspace, root package.json, or this workflow changes.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deps: ${{ steps.filter.outputs.deps }}
      # Mirrors the pinned gate's `web` filter. That list is not extended here.
      # (quality-gate.yml@db900a082cd9f7d1315d1192748324cf49647410, job `changes`).
      web: ${{ steps.filter.outputs.web }}
      # This repository's own filter. The pinned gate is unchanged and has no
      # `backend` filter. Paths are apps/backend plus the workspace packages
      # @repo/web and @repo/backend build from that `web` does not already list.
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        # Same pin as backend-e2e. Full history so a push diff has a parent.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        # Commit the `dorny/paths-filter@v3` tag resolves to (v3.0.4, 2026-08-05).
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          token: ${{ github.token }}
          filters: |
            deps:
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.github/workflows/ci.yml'
            # Mirrors the pinned gate's `web` filter. Do not add paths here.
            # The gate pin is unchanged, and the gate has no `backend` filter.
            # (quality-gate.yml@db900a082cd9f7d1315d1192748324cf49647410, job `changes`).
            web:
              - 'apps/web/**'
              - 'packages/contracts/**'
              - 'packages/auth/**'
              - 'packages/db/**'
              - 'packages/e2e-web/**'
            # This repository only. Not part of the pinned gate.
            # apps/backend, plus workspace packages @repo/web and @repo/backend
            # build from that `web` does not already list (packages/observability
            # and tooling, including transitive eslint, prettier, and typescript).
            backend:
              - 'apps/backend/**'
              - 'packages/observability/**'
              - 'tooling/**'

  quality:
    needs: changes
    # Pinned to a full commit SHA, not @main: every deploy gates on this job
    # (`needs: ci`), so a branch ref lets an external repository change our
    # quality gate — or replace it — without a single review here.
    #
    # Pinned commit: db900a0 "Update timeout settings for jobs in quality gate
    # workflow" (2026-07-05). Reviewed at this SHA on 2026-08-12 (CI-3 / F-09);
    # it runs, in order: pnpm typecheck, pnpm lint, pnpm format, and
    # `pnpm turbo test:cov` for unit tests, plus Playwright e2e when web or its
    # upstream packages change. A final `quality-gate` job fails the run if
    # static checks or e2e fail, so the gate is real rather than nominal.
    #
    # To move the pin: re-review the workflow at the new SHA, then update both
    # the ref and this comment together.
    uses: Quanby-IT-Solutions/.github/.github/workflows/quality-gate.yml@db900a082cd9f7d1315d1192748324cf49647410 # 2026-07-05
    # The gate's own default is 22.20.0, which is below engines.node.
    with:
      node-version: 22.22.1
      # Boolean input. Quoting this expression would pass a string and fail the type check.
      run-e2e: ${{ needs.changes.outputs.deps == 'true' || needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' || inputs.run-e2e == true }}
    # `secrets: inherit` handed every repository secret — AWS keys, the auth
    # signing secret, the database URL — to an external workflow that declares
    # exactly one optional secret. Only that one is passed now, so a compromise
    # of the external repo has nothing to exfiltrate.
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # E2E-001 / QUA-7. Backend Jest e2e should run on PRs to dev.
  #
  # The reusable quality gate's e2e job runs Playwright (`pnpm test:e2e:web`)
  # and has no Postgres service. It never runs `pnpm -F @repo/backend test:e2e`.
  # The `changes` job sets `run-e2e` when `deps` or `backend` is true, and on
  # workflow_dispatch. That flag only selects the gate's unauthenticated
  # Playwright suite. The gate still has no database, and
  # Quanby-IT-Solutions/.github is out of scope, so this job remains the
  # backend regression signal.
  #
  # BETTER_AUTH_SECRET and SEED_ADMIN_PASSWORD are generated in the job,
  # masked, and exported through $GITHUB_ENV. They are not repository secrets
  # and are not echoed. The database password is omitted: the service uses
  # trust auth and lives only for this job.
  backend-e2e:
    name: Backend e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d # 16.15 2026-10-21
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: turbo-template
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d turbo-template"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/turbo-template
      CORS_ORIGINS: http://localhost:3000
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000
    steps:
      - name: Checkout
        # Same pin as deploy-production.yml.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        # Commit the quality gate's `pnpm/action-setup@v4` tag resolves to.
        # v4.4.0 of this action requires Node 24; this commit does not.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # package.json "packageManager" and the quality gate's pnpm-version.
          version: 10.27.0

      - name: Setup Node
        # Commit the quality gate's `actions/setup-node@v4` tag resolves to
        # (v4.4.0). Node version matches engines.node. @thallesp/nestjs-better-auth
        # 2.5.4 requires Node >=22.22.1.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate ephemeral auth secret and seed password
        run: |
          set -euo pipefail
          auth_secret="$(openssl rand -base64 32 | tr -d '\n')"
          seed_password="$(openssl rand -base64 24 | tr -d '\n')"
          echo "::add-mask::${auth_secret}"
          echo "::add-mask::${seed_password}"
          {
            printf 'BETTER_AUTH_SECRET=%s\n' "$auth_secret"
            printf 'SEED_ADMIN_PASSWORD=%s\n' "$seed_password"
          } >> "$GITHUB_ENV"

      - name: Seed the local database
        run: pnpm db:seed

      - name: Backend e2e
        run: pnpm -F @repo/backend test:e2e

  # Authenticated Playwright. Runs when `web`, `backend`, or `deps` changes.
  # The pinned quality gate has no Postgres and starts no backend, and that
  # repository is out of scope, so the gate's e2e job stays the unauthenticated
  # suite. This job brings up Postgres and the API, seeds pre-verified ordinary
  # users, and runs the authenticated projects.
  # Passwords are generated here, masked, and never printed. No repository
  # secrets. Mail stays on the dev json transport (no SMTP_HOST). No Redis.
  web-e2e-auth:
    name: Web e2e auth
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.deps == 'true' || github.event_name == 'workflow_dispatch' || inputs.run-e2e == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d # 16.15 2026-10-21
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: turbo-template
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d turbo-template"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/turbo-template
      E2E_AUTH_API_URL: http://localhost:3000/api/v1/auth/
      BASE_URL: http://localhost:3001
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      NEXT_PUBLIC_API_VERSION: v1
      CORS_ORIGINS: http://localhost:3001
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3001
      APP_WEB_URL: http://localhost:3001
      E2E_TEST_EMAIL: e2e-user-a@turbo-template.local
      E2E_TEST_EMAIL_B: e2e-user-b@turbo-template.local
      # This job only. Code defaults stay 100 requests / 60000 ms.
      # Same numbers as packages/e2e-web/backend-throttle.ts and the README.
      THROTTLE_LIMIT: 5000
      THROTTLE_TTL: 60000
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.27.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate ephemeral auth secret and e2e passwords
        run: |
          set -euo pipefail
          auth_secret="$(openssl rand -base64 32 | tr -d '\n')"
          seed_password="$(openssl rand -base64 24 | tr -d '\n')"
          user_a_password="$(openssl rand -base64 24 | tr -d '\n')"
          user_b_password="$(openssl rand -base64 24 | tr -d '\n')"
          echo "::add-mask::${auth_secret}"
          echo "::add-mask::${seed_password}"
          echo "::add-mask::${user_a_password}"
          echo "::add-mask::${user_b_password}"
          {
            printf 'BETTER_AUTH_SECRET=%s\n' "$auth_secret"
            printf 'SEED_ADMIN_PASSWORD=%s\n' "$seed_password"
            printf 'E2E_ADMIN_PASSWORD=%s\n' "$seed_password"
            printf 'E2E_TEST_PASSWORD=%s\n' "$user_a_password"
            printf 'E2E_TEST_PASSWORD_B=%s\n' "$user_b_password"
          } >> "$GITHUB_ENV"

      - name: Seed the local database
        run: pnpm db:seed

      - name: Seed pre-verified e2e users
        run: pnpm db:seed:e2e

      - name: Build backend
        # `node dist/main.js` loads workspace packages from their dist.
        # Turbo builds those dependencies, then the backend.
        run: pnpm turbo run build --filter=@repo/backend

      - name: Start backend
        run: |
          set -euo pipefail
          nohup pnpm -F @repo/backend start > "$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy"
          tail -n 80 "$RUNNER_TEMP/backend.log" || true
          exit 1

      - name: Install Playwright chromium
        run: pnpm --filter @repo/e2e-web exec playwright install --with-deps chromium

      - name: Web e2e
        run: pnpm test:e2e:web

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-web-e2e-auth
          path: packages/e2e-web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
