name: Deploy Production (ECS Fargate)

on:
  push:
    branches:
      - production
    paths-ignore:
      - "**/*.md"
      - ".vscode/**"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy-production:
    name: Deploy to Production (ECS Fargate)
    runs-on: ubuntu-latest
    environment: production
    env:
      # ==========================================================
      # AWS Infrastructure Configuration
      # ==========================================================
      AWS_REGION: ${{ vars.AWS_REGION }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      ECR_REPOSITORY_WEB: ${{ vars.ECR_REPOSITORY_WEB }}
      ECR_REPOSITORY_BACKEND: ${{ vars.ECR_REPOSITORY_BACKEND }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE_WEB: ${{ vars.ECS_SERVICE_WEB }}
      ECS_SERVICE_BACKEND: ${{ vars.ECS_SERVICE_BACKEND }}

      # ==========================================================
      # App Environment Variables
      # ==========================================================
      NODE_ENV: "production"
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_API_VERSION: "1"
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_TRUSTED_ORIGINS: ${{ secrets.BETTER_AUTH_TRUSTED_ORIGINS }}
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ──────────────────────────────────────────────
      # Validate required variables
      # ──────────────────────────────────────────────
      - name: Validate required deployment variables
        run: |
          set -euo pipefail

          require_var() {
            local name="$1"
            if [ -z "${!name:-}" ]; then
              echo "❌ Missing required variable: $name"
              exit 1
            fi
          }

          # AWS and ECS configuration
          require_var AWS_REGION
          require_var PROJECT_NAME
          require_var ECR_REPOSITORY_WEB
          require_var ECR_REPOSITORY_BACKEND
          require_var ECS_CLUSTER
          require_var ECS_SERVICE_WEB
          require_var ECS_SERVICE_BACKEND

          # App configuration
          require_var NEXT_PUBLIC_APP_URL
          require_var NEXT_PUBLIC_API_BASE_URL
          require_var NEXT_PUBLIC_API_VERSION
          require_var DATABASE_URL
          require_var CORS_ORIGINS
          require_var BETTER_AUTH_SECRET
          require_var BETTER_AUTH_TRUSTED_ORIGINS

          echo "✅ Required deployment variables are set"

      # ──────────────────────────────────────────────
      # Terraform (ensure infrastructure is up)
      # ──────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=aws/terraform init

      - name: Terraform Plan
        run: terraform -chdir=aws/terraform plan -var="project_name=${PROJECT_NAME}" -var="environment=production"

      - name: Terraform Apply
        run: terraform -chdir=aws/terraform apply -auto-approve -var="project_name=${PROJECT_NAME}" -var="environment=production"

      # ──────────────────────────────────────────────
      # Build and push Docker images to ECR
      # ──────────────────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-production-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-production-

      - name: Build and push Web image to ECR
        id: build-web
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "=========================================="
          echo "Building Web Docker Image (production)"
          echo "=========================================="

          docker buildx build \
            --file apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL \
            --build-arg NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL \
            --build-arg NEXT_PUBLIC_API_VERSION=$NEXT_PUBLIC_API_VERSION \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --push \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY_WEB:$IMAGE_TAG \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY_WEB:latest \
            .

          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

          echo "✓ Web image pushed"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY_WEB:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build and push Backend image to ECR
        id: build-backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "=========================================="
          echo "Building Backend Docker Image (production)"
          echo "=========================================="

          docker buildx build \
            --file apps/backend/Dockerfile \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --push \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest \
            .

          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

          echo "✓ Backend image pushed"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # ──────────────────────────────────────────────
      # Deploy to ECS Fargate
      # ──────────────────────────────────────────────
      - name: Update Web task definition
        id: update-task-def-web
        run: |
          echo "=========================================="
          echo "Updating Web Task Definition (production)"
          echo "=========================================="

          export PROJECT_NAME AWS_ACCOUNT_ID AWS_REGION IMAGE_TAG NEXT_PUBLIC_APP_URL NEXT_PUBLIC_API_BASE_URL NEXT_PUBLIC_API_VERSION
          export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          envsubst < aws/ecs/task-definition-web.json > /tmp/task-def-web-updated.json

          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/task-def-web-updated.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "✓ Web task definition updated: $TASK_DEF_ARN"
          echo "task_def_arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT

      - name: Deploy Web to ECS
        run: |
          echo "=========================================="
          echo "Deploying Web Service (production)"
          echo "=========================================="

          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE_WEB \
            --task-definition ${{ steps.update-task-def-web.outputs.task_def_arn }} \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE_WEB

          echo "✓ Web service is stable"

      - name: Update Backend task definition
        id: update-task-def-backend
        run: |
          echo "=========================================="
          echo "Updating Backend Task Definition (production)"
          echo "=========================================="

          export PROJECT_NAME AWS_ACCOUNT_ID AWS_REGION IMAGE_TAG
          export DATABASE_URL CORS_ORIGINS BETTER_AUTH_SECRET BETTER_AUTH_TRUSTED_ORIGINS GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET
          export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          envsubst < aws/ecs/task-definition-backend.json > /tmp/task-def-backend-updated.json

          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/task-def-backend-updated.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "✓ Backend task definition updated: $TASK_DEF_ARN"
          echo "task_def_arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT

      - name: Deploy Backend to ECS
        run: |
          echo "=========================================="
          echo "Deploying Backend Service (production)"
          echo "=========================================="

          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE_BACKEND \
            --task-definition ${{ steps.update-task-def-backend.outputs.task_def_arn }} \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE_BACKEND

          echo "✓ Backend service is stable"

      # ──────────────────────────────────────────────
      # Summary
      # ──────────────────────────────────────────────
      - name: Deployment summary
        run: |
          echo "=========================================="
          echo "Production Deployment Complete!"
          echo "=========================================="
          echo "Strategy:     ECS Fargate"
          echo "Project:      ${{ env.PROJECT_NAME }}"
          echo "Region:       ${{ env.AWS_REGION }}"
          echo "Branch:       production"
          echo "Commit SHA:   ${{ github.sha }}"
          echo ""
          echo "Web Image:    ${{ steps.build-web.outputs.image }}"
          echo "Web Task Def: ${{ steps.update-task-def-web.outputs.task_def_arn }}"
          echo "Web Service:  $ECS_CLUSTER/$ECS_SERVICE_WEB"
          echo ""
          echo "Backend Image:    ${{ steps.build-backend.outputs.image }}"
          echo "Backend Task Def: ${{ steps.update-task-def-backend.outputs.task_def_arn }}"
          echo "Backend Service:  $ECS_CLUSTER/$ECS_SERVICE_BACKEND"
          echo "=========================================="
