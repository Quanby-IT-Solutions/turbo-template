name: Deploy Staging (EC2 + Elastic IP)

on:
  push:
    branches:
      - staging
    paths-ignore:
      - "**/*.md"
      - ".vscode/**"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

# CI-6: least privilege. This workflow reads the repo and talks to AWS and the
# staging host with their own credentials; it never writes back to GitHub.
permissions:
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy-staging:
    name: Deploy to Staging (EC2 + Elastic IP)
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPOSITORY_WEB: ${{ vars.ECR_REPOSITORY_WEB }}
      ECR_REPOSITORY_BACKEND: ${{ vars.ECR_REPOSITORY_BACKEND }}
      STG_EC2_HOST: ${{ vars.STG_EC2_HOST }}
      # Public host key of the staging EC2 instance, in known_hosts format
      # (`ssh-keyscan -t ed25519 <host>`). A repo *variable*, not a secret — it
      # is public key material, and keeping it readable means a change is
      # visible in review rather than silently swapped. See RF4.
      STG_EC2_HOST_KEY: ${{ vars.STG_EC2_HOST_KEY }}
      NODE_ENV: "production"
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_API_VERSION: ${{ vars.NEXT_PUBLIC_API_VERSION }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_TRUSTED_ORIGINS: ${{ secrets.BETTER_AUTH_TRUSTED_ORIGINS }}
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate required variables
        run: |
          set -euo pipefail
          require_var() { [ -n "${!1:-}" ] || { echo "❌ Missing: $1"; exit 1; }; }
          require_var AWS_REGION
          require_var ECR_REGISTRY
          require_var ECR_REPOSITORY_WEB
          require_var ECR_REPOSITORY_BACKEND
          require_var STG_EC2_HOST
          # Without a pinned host key there is nothing to verify the server
          # against, so refuse to deploy rather than fall back to trusting
          # whatever answers (RF4).
          require_var STG_EC2_HOST_KEY
          require_var NEXT_PUBLIC_APP_URL
          require_var NEXT_PUBLIC_API_BASE_URL
          require_var DATABASE_URL
          require_var CORS_ORIGINS
          require_var BETTER_AUTH_SECRET
          require_var BETTER_AUTH_TRUSTED_ORIGINS
          echo "✅ All required variables present"

      # ── Build & push Docker images to ECR ──────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
        with:
          mask-password: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Cache Docker layers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/.buildx-cache
          # CI-6 / F-27: the key is content-addressed on the Dockerfiles and
          # the lockfile, and restore-keys is scoped to the same ref. A broad
          # prefix let a build on any ref restore -- and then extend -- a cache
          # populated by another ref, which is a path for a poisoned layer from
          # an untrusted branch to reach a deploy build.
          key: ${{ runner.os }}-buildx-staging-${{ github.ref_name }}-${{ hashFiles('apps/*/Dockerfile', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-staging-${{ github.ref_name }}-${{ hashFiles('apps/*/Dockerfile', 'pnpm-lock.yaml') }}-
            ${{ runner.os }}-buildx-staging-${{ github.ref_name }}-

      - name: Build and push Web image
        run: |
          docker buildx build \
            --file apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL \
            --build-arg NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL \
            --build-arg NEXT_PUBLIC_API_VERSION=${NEXT_PUBLIC_API_VERSION:-v1} \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --push \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY_WEB:$IMAGE_TAG \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY_WEB:latest \
            .
          rm -rf /tmp/.buildx-cache && mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          echo "✅ Web image pushed: $ECR_REGISTRY/$ECR_REPOSITORY_WEB:$IMAGE_TAG"

      - name: Build and push Backend image
        run: |
          docker buildx build \
            --file apps/backend/Dockerfile \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --push \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest \
            .
          rm -rf /tmp/.buildx-cache && mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          echo "✅ Backend image pushed: $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG"

      # ── SSH deploy to EC2 ───────────────────────────────────────
      - name: Load deploy key into ssh-agent and pin the host key
        env:
          STG_EC2_SSH_KEY: ${{ secrets.STG_EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          # RF4: the private key goes straight from the secret store into the
          # agent's memory. It is never written to the runner's disk, so a
          # failed or compromised later step has no file to read — and no
          # cleanup step has to be relied on to run.
          eval "$(ssh-agent -s)" > /dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$STG_EC2_SSH_KEY" | ssh-add - > /dev/null

          # Pin the expected host key. Public material, so writing it is safe.
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STG_EC2_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          echo "Pinned host keys for: $(cut -d' ' -f1 ~/.ssh/known_hosts | tr '\n' ' ')"

      - name: Deploy via SSH
        run: |
          set -euo pipefail

          # StrictHostKeyChecking=yes + BatchMode=yes is the fail-closed pair:
          # an unknown or changed host key aborts the connection instead of
          # being auto-accepted (the old `=no`) or learned on first sight
          # (`accept-new`), and no prompt can hang the job waiting for input.
          ssh \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o BatchMode=yes \
            ec2-user@$STG_EC2_HOST << DEPLOY
            set -euo pipefail

            # ECR login on the instance
            aws ecr get-login-password --region $AWS_REGION | \
              docker login --username AWS --password-stdin $ECR_REGISTRY

            # Write .env
            cat > /opt/staging/.env << ENV
          ECR_REGISTRY=$ECR_REGISTRY
          ECR_REPOSITORY_WEB=$ECR_REPOSITORY_WEB
          ECR_REPOSITORY_BACKEND=$ECR_REPOSITORY_BACKEND
          IMAGE_TAG=$IMAGE_TAG
          NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL
          NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL
          NEXT_PUBLIC_API_VERSION=${NEXT_PUBLIC_API_VERSION:-v1}
          DATABASE_URL=$DATABASE_URL
          CORS_ORIGINS=$CORS_ORIGINS
          BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET
          BETTER_AUTH_TRUSTED_ORIGINS=$BETTER_AUTH_TRUSTED_ORIGINS
          GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
          GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
          ENV

            # Write docker-compose.staging.yml
            cat > /opt/staging/docker-compose.yml << 'COMPOSE'
          $(cat docker-compose.staging.yml)
          COMPOSE

            # Pull new images and restart
            cd /opt/staging
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

            echo "✅ Deploy complete"
          DEPLOY

      # ── Health check ────────────────────────────────────────────
      - name: Health check
        run: |
          set -uo pipefail
          echo "Waiting 30s for containers to start..."
          sleep 30

          # Both services are probed. Only the backend used to be, which is
          # exactly why the ECR_REPOSITORY_WEB variable swap survived: staging
          # ran the backend image twice and reported itself healthy while no
          # web container was ever started.
          check() {
            local name="$1" url="$2" max=10 i status
            for i in $(seq 1 $max); do
              status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url" || echo "000")
              echo "[$i/$max] $name: HTTP $status"
              case "$status" in
                200|301|302|307|308) echo "✅ $name is healthy"; return 0 ;;
              esac
              sleep 10
            done
            echo "❌ $name health check failed ($url)"
            return 1
          }

          failed=0
          check "Backend" "http://$STG_EC2_HOST:3000/api/v1/health" || failed=1
          check "Web" "http://$STG_EC2_HOST:3001/" || failed=1
          exit $failed

      - name: Deployment summary
        run: |
          echo "==========================================="
          echo "✅ Staging Deployment Complete!"
          echo "==========================================="
          echo "EC2 Host:    $STG_EC2_HOST"
          echo "Web URL:     $NEXT_PUBLIC_APP_URL"
          echo "API URL:     $NEXT_PUBLIC_API_BASE_URL"
          echo "Image Tag:   $IMAGE_TAG"
          echo "Branch:      staging"
          echo "Commit:      ${{ github.sha }}"
          echo "==========================================="
