name: Deploy

on:
  push:
    branches:
      - staging
      - production
    paths-ignore:
      - "**/*.md"
      - ".vscode/**"
      - "docs/**"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      environment:
        description: "Environment to deploy"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}
  cancel-in-progress: true

env:
  DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'production' && 'production' || 'staging') }}
  DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}

  # Image tag (use commit SHA for immutable deployments)
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    name: Deploy to ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'production' && 'production' || 'staging') }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'production' && 'production' || 'staging') }}
    env:
      # ==========================================================
      # AWS INFRASTRUCTURE CONFIGURATION
      # ==========================================================
      AWS_REGION: ${{ vars.AWS_REGION }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      ECR_REPOSITORY_WEB: ${{ vars.ECR_REPOSITORY_WEB }}
      ECR_REPOSITORY_BACKEND: ${{ vars.ECR_REPOSITORY_BACKEND }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE_WEB: ${{ vars.ECS_SERVICE_WEB }}
      ECS_SERVICE_BACKEND: ${{ vars.ECS_SERVICE_BACKEND }}

      # ==========================================================
      # APP ENVIRONMENT VARIABLES
      # ==========================================================
      NODE_ENV: "production"
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_API_VERSION: "1"

      # Authentication (Better Auth)
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_TRUSTED_ORIGINS: ${{ secrets.BETTER_AUTH_TRUSTED_ORIGINS }}

      # Backend Environment Variables
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}

      # Database
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # OAuth Providers (Google)
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - name: Validate manual branch/environment combination
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "ℹ️ Push event detected; using automatic branch/environment mapping."
            exit 0
          fi

          if [ "${DEPLOY_ENV}" = "staging" ] && [ "${DEPLOY_BRANCH}" != "staging" ]; then
            echo "❌ Invalid manual deployment selection: environment 'staging' requires branch 'staging', but got '${DEPLOY_BRANCH}'."
            exit 1
          fi

          if [ "${DEPLOY_ENV}" = "production" ] && [ "${DEPLOY_BRANCH}" != "production" ]; then
            echo "❌ Invalid manual deployment selection: environment 'production' requires branch 'production', but got '${DEPLOY_BRANCH}'."
            exit 1
          fi

          echo "✅ Manual deployment selection is valid: branch '${DEPLOY_BRANCH}' -> environment '${DEPLOY_ENV}'."

      - name: Resolve environment-specific deploy settings
        run: |
          set -euo pipefail

          if [ "$DEPLOY_ENV" = "staging" ]; then
            echo "WEB_TASK_TEMPLATE=aws/ecs/task-definition-web-staging.json" >> $GITHUB_ENV
            echo "BACKEND_TASK_TEMPLATE=aws/ecs/task-definition-backend-staging.json" >> $GITHUB_ENV
          else
            echo "WEB_TASK_TEMPLATE=aws/ecs/task-definition-web.json" >> $GITHUB_ENV
            echo "BACKEND_TASK_TEMPLATE=aws/ecs/task-definition-backend.json" >> $GITHUB_ENV
          fi

      - name: Validate required deployment variables
        run: |
          set -euo pipefail

          require_var() {
            local name="$1"
            if [ -z "${!name:-}" ]; then
              echo "❌ Missing required variable: $name"
              exit 1
            fi
          }

          # AWS and ECS configuration
          require_var AWS_REGION
          require_var PROJECT_NAME
          require_var ECR_REPOSITORY_WEB
          require_var ECR_REPOSITORY_BACKEND
          require_var ECS_CLUSTER
          require_var ECS_SERVICE_WEB
          require_var ECS_SERVICE_BACKEND

          # Web runtime/build configuration
          require_var NEXT_PUBLIC_APP_URL
          require_var NEXT_PUBLIC_API_BASE_URL
          require_var NEXT_PUBLIC_API_VERSION

          # Backend runtime configuration
          require_var DATABASE_URL
          require_var CORS_ORIGINS
          require_var BETTER_AUTH_SECRET
          require_var BETTER_AUTH_TRUSTED_ORIGINS

          echo "✅ Required deployment variables are set"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=aws/terraform init

      - name: Terraform Plan
        run: terraform -chdir=aws/terraform plan -var="project_name=${PROJECT_NAME}" -var="environment=${DEPLOY_ENV}"

      - name: Terraform Apply
        run: terraform -chdir=aws/terraform apply -auto-approve -var="project_name=${PROJECT_NAME}" -var="environment=${DEPLOY_ENV}"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and push Web image to ECR
        id: build-web
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          LATEST_TAG: latest
        run: |
          echo "=========================================="
          echo "Building Web Docker Image ($DEPLOY_ENV)"
          echo "=========================================="
          echo "Repository: $ECR_REGISTRY/$ECR_REPOSITORY_WEB"
          echo "Tag: $IMAGE_TAG"
          echo ""

          docker buildx build \
            --file apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL \
            --build-arg NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL \
            --build-arg NEXT_PUBLIC_API_VERSION=$NEXT_PUBLIC_API_VERSION \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --push \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY_WEB:$IMAGE_TAG \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY_WEB:$LATEST_TAG \
            .

          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

          echo "✓ Web image pushed successfully"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY_WEB:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build and push Backend image to ECR
        id: build-backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          LATEST_TAG: latest
        run: |
          echo "=========================================="
          echo "Building Backend Docker Image ($DEPLOY_ENV)"
          echo "=========================================="
          echo "Repository: $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND"
          echo "Tag: $IMAGE_TAG"
          echo ""

          docker buildx build \
            --file apps/backend/Dockerfile \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --push \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$LATEST_TAG \
            .

          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

          echo "✓ Backend image pushed successfully"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update Web task definition
        id: update-task-def-web
        run: |
          echo "=========================================="
          echo "Updating Web Task Definition ($DEPLOY_ENV)"
          echo "=========================================="

          export PROJECT_NAME AWS_ACCOUNT_ID AWS_REGION IMAGE_TAG NEXT_PUBLIC_APP_URL NEXT_PUBLIC_API_BASE_URL NEXT_PUBLIC_API_VERSION
          export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          envsubst < "$WEB_TASK_TEMPLATE" > /tmp/task-def-web-updated.json

          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/task-def-web-updated.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "✓ Web task definition updated: $TASK_DEF_ARN"
          echo "task_def_arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT

      - name: Deploy Web to ECS
        id: deploy-web
        run: |
          echo "=========================================="
          echo "Deploying Web Service ($DEPLOY_ENV)"
          echo "=========================================="

          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE_WEB \
            --task-definition ${{ steps.update-task-def-web.outputs.task_def_arn }} \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE_WEB

          echo "✓ Web service is stable"

      - name: Update Backend task definition
        id: update-task-def-backend
        run: |
          echo "=========================================="
          echo "Updating Backend Task Definition ($DEPLOY_ENV)"
          echo "=========================================="

          export PROJECT_NAME AWS_ACCOUNT_ID AWS_REGION IMAGE_TAG
          export DATABASE_URL CORS_ORIGINS BETTER_AUTH_SECRET BETTER_AUTH_TRUSTED_ORIGINS GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET
          export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          envsubst < "$BACKEND_TASK_TEMPLATE" > /tmp/task-def-backend-updated.json

          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/task-def-backend-updated.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "✓ Backend task definition updated: $TASK_DEF_ARN"
          echo "task_def_arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT

      - name: Deploy Backend to ECS
        id: deploy-backend
        run: |
          echo "=========================================="
          echo "Deploying Backend Service ($DEPLOY_ENV)"
          echo "=========================================="

          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE_BACKEND \
            --task-definition ${{ steps.update-task-def-backend.outputs.task_def_arn }} \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE_BACKEND

          echo "✓ Backend service is stable"

      - name: Deployment summary
        run: |
          echo "=========================================="
          echo "Deployment completed successfully!"
          echo "=========================================="
          echo "Project: ${{ env.PROJECT_NAME }}"
          echo "Environment: ${{ env.DEPLOY_ENV }}"
          echo "Branch: ${{ env.DEPLOY_BRANCH }}"
          echo "Region: ${{ env.AWS_REGION }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo ""
          echo "Web Image: ${{ steps.build-web.outputs.image }}"
          echo "Web Task Definition: ${{ steps.update-task-def-web.outputs.task_def_arn }}"
          echo "Web Service: $ECS_CLUSTER/$ECS_SERVICE_WEB"
          echo ""
          echo "Backend Image: ${{ steps.build-backend.outputs.image }}"
          echo "Backend Task Definition: ${{ steps.update-task-def-backend.outputs.task_def_arn }}"
          echo "Backend Service: $ECS_CLUSTER/$ECS_SERVICE_BACKEND"
          echo "=========================================="

          echo "web_image_url=${{ steps.build-web.outputs.image }}" >> $GITHUB_ENV
          echo "backend_image_url=${{ steps.build-backend.outputs.image }}" >> $GITHUB_ENV
