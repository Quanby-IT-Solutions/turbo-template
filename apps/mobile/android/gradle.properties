org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Permanent fix: Disable configuration cache to prevent provider access issues with Flutter plugins
org.gradle.configuration-cache=false
org.gradle.unsafe.configuration-cache=false
org.gradle.configureondemand=false
org.gradle.parallel=false

# Windows (multi-drive) + Kotlin incremental compilation can break when plugin sources live on C:
# but the project is on D:, producing "different roots" incremental cache errors.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false