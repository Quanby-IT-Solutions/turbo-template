name: mobile
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  riverpod: ^3.0.3

  # Navigation
  go_router: ^16.2.4

  # UI Components
  cached_network_image: ^3.3.0
  image_picker: ^1.0.4

  # Charts for health tracking
  fl_chart: ^1.1.1

  # Date/Time handling
  intl: ^0.20.0

  # HTTP client
  http: ^1.1.0
  cookie_jar: ^4.0.8
  dio: ^5.4.0
  dio_cookie_manager: ^3.1.1

  # JSON serialization
  json_annotation: ^4.8.1

  # Utilities
  equatable: ^2.0.5
  uuid: ^4.1.0
  flex_color_scheme: ^8.3.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  flutter_dotenv: ^5.2.1
  responsive_framework: ^1.5.1
  animated_bottom_navigation_bar: ^1.4.0
  font_awesome_flutter: ^10.9.1
  awesome_snackbar_content: ^0.1.1
  toastification: ^3.0.3
  # Temporarily disabled due to Gradle build error
  # flutter_native_splash: ^2.4.7
  introduction_screen: ^4.0.0
  awesome_notifications: ^0.10.1
  draggable_home: ^1.0.5
  permission_handler: ^12.0.1
  animate_do: ^4.2.0
  qr_flutter: ^4.1.0

  # Secure storage for authentication tokens
  flutter_secure_storage: ^10.0.0

  # BiosenseSignal SDK for vital signs measurement
  biosensesignal_flutter_sdk:
    path: ../BiosenseSignal_Flutter_SDK_5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.7
  riverpod_generator: ^3.0.3
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env

flutter_native_splash:
  # Background color (Q-Health blue)
  color: "#0170B0"

  # Use the existing logo image
  image: assets/images/logo.png

  # Dark mode settings
  color_dark: "#0170B0"
  image_dark: assets/images/logo.png

  # Android 12+ specific settings
  android_12:
    image: assets/images/logo.png
    color: "#0170B0"
    image_dark: assets/images/logo.png
    color_dark: "#0170B0"

  # Platform specific settings
  android: true
  ios: true
  web: false

  # Positioning
  android_gravity: center
  ios_content_mode: center
