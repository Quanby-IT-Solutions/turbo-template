# ──────────────────────────────────────────────
# API Subdomain - HTTP Only (pre-SSL)
# ──────────────────────────────────────────────
# Template: __DOMAIN__ is replaced with the actual domain
# during deployment (e.g., api.staging.yourdomain.com)
#
# After running init-ssl.sh, the deploy workflow will
# automatically switch to api-ssl.conf instead.
# ──────────────────────────────────────────────

server {
    listen 80;
    server_name __DOMAIN__;

    # Certbot challenge (required for SSL certificate generation)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Larger body size for API uploads
        client_max_body_size 50m;
    }
}
