# ==========================================================
# PRODUCTION DEPLOYMENT - EC2 behind a load balancer (ASG)
# ==========================================================
# Runs web (port 3001) and backend (port 3000) containers.
# The load balancer handles subdomain routing and SSL termination.
# It appends the address it saw onto X-Forwarded-For. TRUST_PROXY=1
# matches that one hop. Nginx is the local / dev proxy only and is
# not part of this file.
#
# Backend publish address: ${BACKEND_BIND_ADDRESS:-0.0.0.0}:3000:3000.
# Set BACKEND_BIND_ADDRESS to the instance's private IPv4 in the
# environment that launches compose. On EC2 the Elastic IP is translated
# 1:1 to the private IPv4, so binding to the private address only limits
# the host-side publish to that one interface. Direct access must be blocked
# by a security group that allows port 3000 only from the load balancer's
# security group, and that group is managed outside this repo. Leave it
# unset and the default stays 0.0.0.0, so a deploy does not fail for a
# missing variable.
# Do not bind this port to 127.0.0.1 and do not drop the host mapping.
# Web stays on 0.0.0.0:3001. The web container reaches the backend over
# the compose network (INTERNAL_API_BASE_URL=http://backend:3000/api).
# The target group that calls the health check is provisioned outside
# this repo.
#
# Each app gets its own subdomain via load-balancer host-header rules:
#   - turbo.quanbyit.com      → web:3001
#   - turbo-be.quanbyit.com   → backend:3000
#
# This file is stored in SSM Parameter Store (base64) and pulled by
# EC2 instances on boot. The boot script, and the place that would set
# BACKEND_BIND_ADDRESS to each instance's private IPv4, live outside
# this repo. The production workflow publishes this file and a shared
# env payload; that payload has no per-instance private address.
# ==========================================================

services:
  # ----------------------------------------------------------
  # Web Application (Next.js)
  # ----------------------------------------------------------
  web:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_WEB}:${IMAGE_TAG:-latest}
    container_name: production-web
    ports:
      - "0.0.0.0:3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - INTERNAL_API_BASE_URL=http://backend:3000/api
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
      - NEXT_PUBLIC_API_VERSION=${NEXT_PUBLIC_API_VERSION}
      # Sentry for the server and edge runtimes only. The NEXT_PUBLIC_* twins are
      # deliberately absent: those are inlined into the client bundle at build
      # time, so setting them here would change nothing in the browser. Defaults
      # keep crash reporting off when the SSM payload carries no Sentry values.
      #
      # The DSN comes from WEB_SENTRY_DSN, not a shared SENTRY_DSN: the DSN is
      # what selects the Sentry project, so web and backend need their own to
      # land in separate projects. It is mapped onto the container-local
      # SENTRY_DSN name the app reads. Set WEB_SENTRY_DSN and BACKEND_SENTRY_DSN
      # to the same value to collapse both apps into one Sentry project.
      - SENTRY_ENABLED=${SENTRY_ENABLED:-false}
      - SENTRY_DSN=${WEB_SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------------------------
  # Backend API (NestJS)
  # ----------------------------------------------------------
  backend:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_BACKEND}:${IMAGE_TAG:-latest}
    container_name: production-backend
    ports:
      - "${BACKEND_BIND_ADDRESS:-0.0.0.0}:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_TRUSTED_ORIGINS=${BETTER_AUTH_TRUSTED_ORIGINS}
      - BETTER_AUTH_COOKIE_DOMAIN=${BETTER_AUTH_COOKIE_DOMAIN}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - APP_WEB_URL=${APP_WEB_URL:-${NEXT_PUBLIC_APP_URL:-http://localhost:3001}}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - 'MAIL_FROM=${MAIL_FROM:-"Dev Mailer" <no-reply@localhost>}'
      - EMAIL_VERIFICATION_ENABLED=${EMAIL_VERIFICATION_ENABLED:-true}
      - EMAIL_VERIFICATION_REQUIRED=${EMAIL_VERIFICATION_REQUIRED:-false}
      - AUTH_RATE_LIMIT_WINDOW=${AUTH_RATE_LIMIT_WINDOW:-60}
      - AUTH_RATE_LIMIT_MAX=${AUTH_RATE_LIMIT_MAX:-10}
      - THROTTLE_TTL=${THROTTLE_TTL:-60000}
      - THROTTLE_LIMIT=${THROTTLE_LIMIT:-100}
      - THROTTLE_STRICT_TTL=${THROTTLE_STRICT_TTL:-60000}
      - THROTTLE_STRICT_LIMIT=${THROTTLE_STRICT_LIMIT:-10}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # AB-2: shared throttle counters + RBAC cache across instances.
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - REDIS_KEY_PREFIX=${REDIS_KEY_PREFIX:-turbo-template}
      - ENABLE_API_DOCS=${ENABLE_API_DOCS:-false}
      # Sentry. Same two-part gate as everywhere else — the flag alone does
      # nothing without a DSN, and both default to off so an unconfigured
      # deployment boots exactly as it did before Sentry existed.
      #
      # The DSN comes from BACKEND_SENTRY_DSN, the backend's own project, mapped
      # onto the container-local SENTRY_DSN name the app reads. Set it and
      # WEB_SENTRY_DSN to the same value to collapse both apps into one project.
      - SENTRY_ENABLED=${SENTRY_ENABLED:-false}
      - SENTRY_DSN=${BACKEND_SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0}
      # instrument.ts reports this as the Sentry release, so stack traces map
      # back to the exact image. It is the deployed commit SHA (set by CI).
      - IMAGE_TAG=${IMAGE_TAG:-latest}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/v1/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ----------------------------------------------------------
  # Redis — shared throttle counters + RBAC permission cache (AB-2)
  # ----------------------------------------------------------
  # No `ports:` mapping on purpose. Redis is reachable only from the compose
  # network by service name; publishing it would expose a data store to the
  # internet for no reason.
  redis:
    image: redis:7-alpine
    container_name: turbo-template-redis
    # `requirepass` via command so the password comes from the environment
    # rather than a baked-in config file. REDIS_PASSWORD has no default: an
    # unauthenticated Redis must not be reachable even inside the network.
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD is required}",
        "--appendonly",
        "no",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
