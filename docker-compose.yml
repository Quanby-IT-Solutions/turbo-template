# ==========================================================
# TURBOREPO DEVELOPMENT ENVIRONMENT
# ==========================================================
# This Docker Compose configuration sets up the full application stack
# for local development with both web and backend services.
#
# Single entrypoint: Nginx reverse proxy on http://localhost
#   /api/* -> backend (NestJS),  /* -> web (Next.js)
# Web/backend are NOT published directly — only Nginx is.
#
# Usage:
#   docker-compose up -d --build      # Build + start all services
#   docker-compose down                # Stop and remove containers
#   docker-compose logs -f            # Follow logs
# ==========================================================

services:
  # ----------------------------------------------------------
  # Reverse Proxy (Nginx) — single entrypoint
  # ----------------------------------------------------------
  # Routes /api/* -> backend:3000, everything else -> web:3001.
  # Access the whole stack at http://localhost
  nginx:
    image: nginx:alpine
    container_name: turbo-template-nginx
    ports:
      - "80:80" # single published port (clean URLs, no :port)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network
    depends_on:
      - web
      - backend
    restart: unless-stopped

  # ----------------------------------------------------------
  # Web Application (Next.js)
  # ----------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Build-time arguments for Next.js (inlined during build)
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
        - NEXT_PUBLIC_API_VERSION=${NEXT_PUBLIC_API_VERSION}
    container_name: turbo-template-web
    # No published host port — Nginx is the only entrypoint.
    expose:
      - "3001"
    environment:
      # Server Configuration
      - NODE_ENV=production
      # Next.js standalone server defaults to 3000 — pin it to 3001 so it
      # matches the Nginx upstream and EXPOSE.
      - PORT=3001
      - HOSTNAME=0.0.0.0

      # Server-side (SSR) calls stay on the internal Docker network
      - INTERNAL_API_BASE_URL=http://backend:3000/api

      # Public URLs (Client-side accessible, baked at build time)
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
      - NEXT_PUBLIC_API_VERSION=${NEXT_PUBLIC_API_VERSION}
    env_file:
      - apps/web/.env
    networks:
      - app-network
    depends_on:
      - backend
    restart: unless-stopped

  # ----------------------------------------------------------
  # Backend API (NestJS)
  # ----------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: turbo-template-backend
    # No published host port — reachable only via the internal network / Nginx.
    expose:
      - "3000"
    # Lets the container reach a Postgres running on the host via
    # host.docker.internal (set DATABASE_URL accordingly). Harmless if you
    # instead run a Postgres service in compose.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Server Configuration
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - apps/backend/.env
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/v1/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
