# ==========================================================
# SINGLE-PORT REVERSE PROXY — PRODUCTION (TLS terminates here)
# ==========================================================
# This config is live, not a commented-out example. The whole
# TLS block used to be commented out and the upstreams pointed at
# host.docker.internal, so what shipped neither terminated TLS nor routed
# correctly under Compose.
#
# One entrypoint serves both apps via path-based routing:
#   /api/*  -> backend:3000  (NestJS global prefix is /api)
#   /*      -> web:3001      (Next.js)
# Same-origin, so no browser CORS and ONE certificate for both apps.
#
# Requires, mounted into the container:
#   /etc/nginx/certs/fullchain.pem
#   /etc/nginx/certs/privkey.pem
# Issue them with certbot (see README "TLS certificates"):
#   certbot certonly --webroot -w /var/www/certbot -d <your-domain>
#
# Local development uses nginx.dev.conf instead — plain HTTP, no certificates.
# ==========================================================

# ---- HTTP: ACME challenge, everything else redirected -------------------
server {
    listen 80;
    server_name _;

    # Certbot's http-01 challenge must stay reachable over HTTP, otherwise
    # renewal breaks the moment the redirect below is in place.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ---------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS 1.2 is the floor: 1.0 and 1.1 are deprecated and 1.3 is preferred
    # wherever the client supports it.
    ssl_protocols TLSv1.2 TLSv1.3;
    # Forward-secret suites only. No RSA key exchange, no CBC, no 3DES.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # TLS 1.3 picks its own suites; let the client's preference win there.
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Docker's embedded DNS. Combined with the variables below, Nginx
    # re-resolves upstreams at request time, so recreating web/backend (new
    # IPs) does NOT require an Nginx restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- Request size ------------------------------------------------------
    # Oversized bodies die here rather than being buffered by the app. Set
    # above the app's own 100kb parser limit on purpose: this counts the whole
    # request including headers, so matching the two exactly would let header
    # size decide whether a legitimate body is rejected, and by the wrong
    # layer. Junk is refused at the edge; borderline requests get a coherent
    # 413 from the application.
    client_max_body_size 1m;

    # Bound how long a client may take to send its request. Without these a
    # slow trickle holds a worker open indefinitely.
    client_body_timeout 15s;
    client_header_timeout 15s;

    # ---- Security headers --------------------------------------------------
    # Deliberately minimal. Next.js owns the page CSP and NestJS owns the API
    # headers; re-sending either here would duplicate them, and browsers
    # INTERSECT multiple CSPs, so two reasonable policies can combine into one
    # that breaks the app.
    #
    # `always` matters: without it these are skipped on error responses, which
    # is exactly when Nginx answers by itself (its own 413 from the limit
    # above, or a 502) and no application header exists to inherit.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Upstream timeouts -------------------------------------------------
    # A stalled upstream previously held the connection open with no ceiling.
    # 60s is comfortably above the slowest legitimate request (image builds
    # and migrations do not run through this proxy) and well under any
    # sensible load-balancer idle timeout.
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # ---- X-Forwarded-For: SET, never appended -----------------------------
    # Set the header from the connection address ($remote_addr). Overwriting
    # means the header carries exactly ONE entry — the peer address Nginx
    # accepted — which is what ThrottlerProxyGuard keys on, so keys stay per
    # client.
    #
    # TOPOLOGY ASSUMPTION: this proxy is the single hop in front of the app,
    # so the backend must run with TRUST_PROXY=1. If another proxy or load
    # balancer is placed in front of Nginx, this must become
    # $proxy_add_x_forwarded_for AND TRUST_PROXY raised to match the real hop
    # count — change the tracker and the hop count together.

    # Backend API (keep the /api prefix — the backend expects it)
    location /api/ {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # $scheme is https here, so the app knows the request arrived secure.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -> Next.js
    location / {
        set $web_upstream http://web:3001;
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;       # websockets (Next.js)
        proxy_set_header Connection "upgrade";
    }
}
