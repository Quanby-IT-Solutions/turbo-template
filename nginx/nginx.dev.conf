# ==========================================================
# SINGLE-PORT REVERSE PROXY — LOCAL DEVELOPMENT (HTTP only)
# ==========================================================
# This is the DEV override. Production TLS lives in nginx.conf, which ships
# working rather than commented out (ED-2 / F-15).
#
# Selected by compose:
#   NGINX_CONF=./nginx/nginx.dev.conf docker compose --profile docker-proxy up
# which is the default, so a fresh clone works over plain HTTP with no
# certificates.
# ==========================================================
# One entrypoint serves both apps via path-based routing:
#   /api/*  -> backend:3000  (NestJS global prefix is /api)
#   /*      -> web:3001      (Next.js)
#
# Same-origin => no browser CORS, and ONE TLS cert in production.
# Local: HTTP only on port 80 (published as :80 by compose).
# ==========================================================

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Combined with the variables below, this makes
    # Nginx re-resolve upstreams at request time, so recreating the web/
    # backend containers (new IPs) does NOT require an Nginx restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- Request size (AB-4 / F-14) ----------------------------------------
    # Oversized bodies die here rather than being buffered by the app. Set
    # above the app's own 100kb parser limit on purpose: this counts the whole
    # request including headers, so matching the two exactly would let header
    # size decide whether a legitimate body is rejected, and by the wrong
    # layer. Junk is refused at the edge; borderline requests get a coherent
    # 413 from the application.
    client_max_body_size 1m;

    # Bound how long a client may take to send its request. Without these a
    # slow trickle holds a worker open indefinitely (slowloris).
    client_body_timeout 15s;
    client_header_timeout 15s;

    # ---- Security headers (ED-1 / F-12) ------------------------------------
    # Deliberately minimal. Next.js owns the page CSP and NestJS owns the API
    # headers; re-sending either here would duplicate them, and browsers
    # INTERSECT multiple CSPs, so two reasonable policies can combine into one
    # that breaks the app.
    #
    # `always` matters: without it these are skipped on error responses, which
    # is exactly when Nginx answers by itself (its own 413 from the limit
    # above, or a 502) and no application header exists to inherit.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Upstream timeouts (AB-4 / F-14) -----------------------------------
    # A stalled upstream previously held the connection open with no ceiling.
    # 60s is comfortably above the slowest legitimate request (image builds
    # and migrations do not run through this proxy) and well under any
    # sensible load-balancer idle timeout.
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # ------------------------------------------------------------------
    # CLIENT IP TRUST CHAIN (see DOMAIN-MODEL.md, Risky Flow RF2)
    # ------------------------------------------------------------------
    # X-Forwarded-For is SET (overwritten), never appended. Using
    # $proxy_add_x_forwarded_for would preserve whatever the client sent and
    # prepend it to the list, letting any caller mint an arbitrary
    # rate-limit bucket per request by varying the header.
    #
    # Overwriting with $remote_addr means the header carries exactly ONE
    # entry — the peer address Nginx accepted the connection from — which is
    # the value the backend throttler keys on (ThrottlerProxyGuard).
    #
    # TOPOLOGY ASSUMPTION: this proxy is the single hop in front of the app,
    # so the backend must run with TRUST_PROXY=1. If another proxy/LB is
    # placed in front of Nginx, this must become
    # `$proxy_add_x_forwarded_for` AND TRUST_PROXY raised to match the real
    # hop count — the two settings must always agree.
    # ------------------------------------------------------------------

    # Backend API (keep the /api prefix — backend expects it)
    location /api/ {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -> Next.js
    location / {
        set $web_upstream http://web:3001;
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;       # websockets (Next.js)
        proxy_set_header Connection "upgrade";
    }
}
